name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Builds the plugin, the selector and the bench, runs the selector's
      # unit tests, evaluates the NixOS and Home Manager modules, parses the
      # generated PipeWire and WirePlumber configs with PipeWire's own parser,
      # and checks format and lint.
      - run: nix flake check --print-build-logs
      - name: docs/options.md is up to date
        run: |
          nix build .#options-doc --out-link options-doc
          diff -u docs/options.md options-doc
